# The live site serves the React front end in frontend-react/.
# The Svelte app at the repo root is kept but no longer deployed.
[build]
  base = "frontend-react"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Client-side routes (e.g. /t/tourists-go-home) all serve the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
