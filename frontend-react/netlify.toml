# The live site serves the React front end in frontend-react/.
# The Svelte app at the repo root is kept but no longer deployed.
[build]
  base = "frontend-react"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public by design (the publishable key only allows what the database's access rules allow).
  VITE_SUPABASE_URL = "https://rtfssrhtookyhkqwogde.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_eu_o5ICXBkPHoqXoAw-aHg_I4HSm3Pw"

# Client-side routes (e.g. /t/tourists-go-home) all serve the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
